name: Castelion
description: >-
  Castelion is a vertically integrated defense technology company that designs,
  tests, and manufactures next-generation military systems, with a focus on
  affordable, mass-producible hypersonic strike weapons such as its Blackbeard
  system, built rapidly and at scale to deter future conflict. Founded by former
  SpaceX and defense-industry engineers, it operates manufacturing and test
  facilities in Torrance, CA; Rio Rancho, NM; Midland, TX; and Allen, TX.
  Castelion is privately held and backed by Andreessen Horowitz (a16z), General
  Catalyst, and Lightspeed Venture Partners. It publishes no public API,
  developer portal, or technical documentation; this API Evangelist profile
  tracks it as a company in the network.
